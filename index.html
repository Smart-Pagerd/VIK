<style>

nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin:2px 0}

main{flex:1;min-width:0;padding:0 22px 40px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}

button,.btn{font:inherit;cursor:pointer}.b{background:var(--p);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600}.b:hover{background:#6d28d9}
.g{background:none;color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:7px 12px}.g:hover{border-color:var(--p2)}
.r{background:none;color:var(--bad);border:1px solid #5b1d2c;border-radius:10px;padding:7px 12px}.hotb{background:var(--hot);color:#000;border:0;border-radius:10px;padding:8px 14px;font-weight:800}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
h2{margin:22px 0 12px;font-size:22px}h3{margin:0 0 10px;font-size:15px;color:var(--acc)}

.mu{color:var(--mu);font-size:13px}input,select,textarea{background:#0a0614;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}textarea{width:100%;min-height:90px}
.warn{background:#2a2306;border:1px solid #7a6a10;color:var(--hot);border-radius:12px;padding:10px 14px;font-size:13px;margin:10px 0}
.tag{background:#2e1d52;color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px}.up{color:var(--ok)}.dn{color:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:8px;overflow-x:auto}.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px}.day.today{border-color:var(--hot)}
.ev{background:var(--p);border-radius:8px;padding:4px 6px;font-size:12px;margin-top:5px;cursor:pointer}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}.bars div{flex:1;background:linear-gradient(var(--p2),var(--p));border-radius:6px 6px 0 0;text-align:center;font-size:11px;color:#000;min-height:4px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;padding:10px 18px;border-radius:12px;font-weight:600;display:none;z-index:30}
#dlg{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20}#dlg>div{background:var(--card);border:1px solid var(--p);border-radius:16px;padding:22px;max-width:380px;width:92%}
#notes{position:fixed;right:14px;bottom:14px;width:260px;background:var(--card);border:1px solid var(--p);border-radius:14px;padding:12px;display:none;z-index:10}
body.comm .oo,body.comm #live,body.comm #timer,body.comm #notes{display:none!important}body.login .oo,body.login #live,body.login #timer,body.login #notes,body.login #vb,body.login #auth,body.login nav{display:none!important}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}nav .logo{display:none}nav button{width:auto;white-space:nowrap}main{padding:0 12px 40px}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:var(--p2)}}

const V={
Inicio(){const nx=S.events.filter(e=>e.date>=today).sort((a,b)=>a.date+a.time>b.date+b.time?1:-1)[0],c=cur(),done=S.checks.filter(x=>x[1]).length;

<div class="card"><h3>Lista de preparación (${done}/${S.checks.length})</h3>${S.checks.map((x,i)=>`<label class="row"><input type="checkbox" ${x[1]?'checked':''} onchange="S.checks[${i}][1]=this.checked?1:0;save();go('Inicio')"> ${esc(x[0])}</label>`).join('')}</div>
<div class="card"><h3>Sonando ahora</h3><b>${esc(c.t)}</b> <span class="mu">${esc(c.a)}</span><p class="mu">Sugerida por ${esc(c.by)} · ${S.playing?'Reproduciendo':'En pausa'}</p><button class="g" onclick="S.playing=!S.playing;save();go('Inicio')">${S.playing?'Pausar':'Reproducir'}</button></div>

<div class="grid">${L.map(g=>`<div class="card"><b>${g[0]}</b> <span class="tag">${g[1]}</span> <span class="tag">${g[2]}</span><p class="mu">${g[3]}k espectadores · ${g[4]} canales · descubrimiento <b>${g[5]}</b></p>

<div class="card"><h3>Términos bloqueados</h3>${S.blocked.map((b,i)=>`<span class="tag">${esc(b)} <a href="#" onclick="S.blocked.splice(${i},1);save();go('Comunidad');return false" aria-label="Quitar">✕</a></span> `).join('')}<div class="row"><input id="bt" placeholder="Nuevo término"><button class="b" onclick="if($('bt').value.trim()){S.blocked.push($('bt').value.trim());save();go('Comunidad')}">Añadir</button></div></div>
<div class="card"><h3>Roles</h3><div class="row"><div class="grow">Moderadores</div><span class="tag">Chat, términos</span></div><div class="row"><div class="grow">Colaboradores</div><span class="tag">Música, calendario</span></div><p class="mu">Gestión de roles: pendiente de backend.</p></div></div>`},
Contenido(){return `<h2>Contenido y promoción</h2><div class="grid"><div class="card"><h3>Momentos destacados</h3><div class="row"><input id="hn" placeholder="Nota del momento"><button class="hotb" onclick="addHl()">Marcar ahora (${nowT()})</button></div>${S.hl.map(h=>`<div class="row"><span class="tag">${h.t}</span> ${esc(h.n)}</div>`).join('')}</div>
<div class="card"><h3>Tareas antes y después</h3>${S.tasks.map((x,i)=>`<label class="row"><input type="checkbox" ${x[1]?'checked':''} onchange="S.tasks[${i}][1]=this.checked?1:0;save()"> ${esc(x[0])}</label>`).join('')}</div>
<div class="card"><h3>Ideas</h3>${S.ideas.map(i=>`<div class="row">${esc(i)}</div>`).join('')}</div>
<div class="card"><h3>Plantilla de anuncio</h3><textarea id="tp" oninput="S.tp=this.value;save()">${esc(S.tp||'🔴 Hoy en directo en twitch.tv/vikbeing\n🎮 [Juego]\n🕗 [Hora]\n¡Os espero!')}</textarea><button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText($('tp').value);toast('Copiado')">Copiar</button></div></div>`},
Estadísticas(){const m=Math.max(...STATS.map(s=>s[1]));return `<h2>Estadísticas</h2><div class="grid"><div class="card"><h3>Espectadores medios por día</h3><div class="bars">${STATS.map(s=>`<div style="height:${s[1]/m*100}%">${s[1]}</div>`).join('')}</div><p class="mu">${STATS.map(s=>s[0]).join(' · ')}</p></div>
<div class="card"><h3>Objetivo: ${esc(S.goal.name)}</h3><progress value="${S.goal.now}" max="${S.goal.max}" style="width:100%;height:18px"></progress><p>${S.goal.now} / ${S.goal.max} <span class="up">+12% vs. semana pasada</span></p><button class="g" onclick="S.goal.now+=10;save();go('Estadísticas')">+10 (demo)</button></div></div><p class="mu">Gráficos de ejemplo. Con Twitch conectado se usarán solo datos autorizados; las estimaciones no son cifras oficiales.</p>`},
Ajustes(){return `<h2>Ajustes</h2><div class="grid"><div class="card"><h3>Integraciones</h3><div class="row"><div class="grow">Twitch</div><span class="tag">${user?'Conectado':'Desconectado'}</span><button class="g" onclick="login()">${user?'Desconectar':'Conectar'}</button></div><div class="row"><div class="grow">Spotify</div><span class="tag">Pendiente</span><button class="g" onclick="toast('Requiere Edge Function con OAuth de Spotify')">Conectar</button></div>
<p class="mu">Nunca pedimos contraseñas: el acceso usa OAuth oficial.</p></div>
<div class="card"><h3>Qué se guarda</h3><p class="mu">Tu calendario, cola, notas, favoritos y ajustes, en tu cuenta de Supabase (solo tú puedes leerlos). Sin cuenta, se guardan en este navegador.</p><button class="r" onclick="ask('¿Borrar todos tus datos de StreamMate?',()=>{S=JSON.parse(JSON.stringify(DEF));save();go('Inicio')})">Restablecer datos</button></div>
<div class="card"><h3>Plataforma de la comunidad</h3><p class="mu">Comparte este mismo enlace con tu chat: quien no sea administrador verá automáticamente el panel de la comunidad. Usa «Vista comunidad» (arriba) para previsualizarlo.</p> <button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href.split('#')[0]);toast('Enlace copiado')">Copiar enlace</button></div><div class="card"><h3>Marca</h3><p class="mu">Zona horaria: ${Intl.DateTimeFormat().resolvedOptions().timeZone} · Idioma: español. Sustituye la «V» del menú por el logo de Vikbeing y ajusta los colores en <code>:root</code> del CSS.</p></div></div>`}};
function fav(g){S.favs=S.favs.includes(g)?S.favs.filter(x=>x!=g):[...S.favs,g];save();go('Juegos')}
function sched(g){S.events.push({id:Date.now(),date:addD(2),time:'20:00',title:'Directo de '+g,game:g});save();toast('Programado para el '+addD(2)+' (edítalo en Calendario)')}
function qs(id,s){S.queue.forEach(q=>{if(q.id==id)q.s=s});save();go('Música')}
function skip(){const i=S.queue.findIndex(q=>q.s=='ok');if(i>=0)S.queue[i].s='x';const n=S.queue.find(q=>q.s=='p');if(n)n.s='ok';save();go('Música')}
function sugg(){const t=$('st').value.trim();if(!t)return toast('Escribe un título');if(S.queue.some(q=>q.t.toLowerCase()==t.toLowerCase()))return toast('Esa canción ya está en la cola');S.queue.push({id:Date.now(),t,a:$('sa').value.trim(),by:'comunidad',s:'p'});save();go('Música')}
function addEv(){const t=$('etl').value.trim();if(!t)return toast('Añade un título');S.events.push({id:Date.now(),date:$('ed').value,time:$('et').value,title:t,game:$('eg').value||'Por definir'});save();go('Calendario');toast('Directo guardado')}
function addHl(){S.hl.unshift({t:nowT(),n:$('hn').value||'Momento destacado'});save();go('Contenido')}
async function loadCom(){if(!sb||!user)return;const [g,m]=await Promise.all([sb.from('game_suggestions').select('*').order('created_at',{ascending:false}),sb.from('music_suggestions').select('*').order('created_at',{ascending:false})]);
 CG=g.data||[];CM=m.data||[];if(['Juegos','Música','Sugerencias'].includes(S.tab))render()}
const CST={pending:'Pendiente',approved:'Aprobado',rejected:'Rechazado'};
function ctl(tb,id){return mod()?`<button class="b" onclick="cs('${tb}','${id}','approved')">Aprobar</button><button class="g" onclick="cs('${tb}','${id}','rejected')">Rechazar</button><button class="r" onclick="ask('¿Eliminar esta sugerencia?',()=>cdel('${tb}','${id}'))">Eliminar</button>`:''}
function comG(){if(!sb||!user)return '<p class="mu">Conecta Twitch para ver las sugerencias de tu comunidad.</p>';
 return `<h3 style="margin-top:22px">Sugerencias de la comunidad (${CG.length})</h3><div class="grid">${CG.map(x=>`<div class="card"><img alt="Imagen de ${esc(x.name)}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px" src="${esc(sb.storage.from('game-images').getPublicUrl(x.image_path).data.publicUrl)}"><b>${esc(x.name)}</b> <span class="tag">${CST[x.status]}</span><div>${x.tags.map(t=>`<span class="tag">${esc(t)}</span> `).join('')}</div><p class="mu">Sugerido por ${esc(x.user_name)}</p><div class="row">${ctl('game_suggestions',x.id)}${mod()&&x.status=='approved'?`<button class="hotb" onclick="sched('${esc(x.name).replace(/'/g,"\\'")}')">Programar</button>`:''}</div></div>`).join('')||'<p class="mu">Todavía no hay sugerencias de juegos.</p>'}</div>`}
function comM(){if(!sb||!user)return '';return `<h3 style="margin-top:22px">Música de la comunidad (${CM.length})</h3><div class="card">${CM.map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b> — ${esc(x.artist)} <span class="tag">${CST[x.status]}</span><div class="mu">por ${esc(x.user_name)}</div></div>${ctl('music_suggestions',x.id)}</div>`).join('')||'<p class="mu">Todavía no hay canciones sugeridas.</p>'}</div>`}
async function cs(tb,id,st){const r=await sb.from(tb).update({status:st}).eq('id',id);if(r.error)return toast('Sin permiso o error: '+r.error.message);toast(st=='approved'?'Aprobado':'Rechazado');loadCom()}
async function cdel(tb,id){const r=await sb.from(tb).delete().eq('id',id);if(r.error)return toast('Error: '+r.error.message);loadCom()}
const TAGS=['Partidas rápidas','Shooter','Cooperativo','Multijugador','Un jugador','Competitivo','Relajante','Terror','Aventura','Acción','RPG','Estrategia','Puzles','Plataformas','Carreras','Deportes','Simulación','Mundo abierto','Sandbox','Supervivencia','Battle Royale','Roguelike','Indie','Lucha','Sigilo','Narrativo','Party game','Retro','Gestión','Construcción','Fantasía','Ciencia ficción'];let PK=new Set();
const uname=()=>{const m=user.user_metadata||{};return (m.preferred_username||m.name||m.full_name||'Anónimo').slice(0,60)};
const VC={
'Sugerir juego'(){return `<h2>Sugerir un juego</h2><div class="card" style="max-width:660px"><label class="mu" for="gn">Nombre del juego</label><input id="gn" maxlength="80" placeholder="Ej: Hades II" style="width:100%"><p class="mu">Etiquetas (de 1 a 6): <b id="cnt">${PK.size}/6</b></p><div style="display:flex;flex-wrap:wrap;gap:6px">${TAGS.map(t=>`<button type="button" class="g" style="border-radius:99px;padding:4px 11px;font-size:13px;${PK.has(t)?'background:var(--p);color:#fff':''}" onclick="ptag(this)">${t}</button>`).join('')}</div><p class="mu">Imagen del juego (obligatoria · PNG, JPG o WEBP · máx. 2 MB)</p><input type="file" id="img" accept="image/png,image/jpeg,image/webp" onchange="pimg()"><br><img id="prev" alt="Vista previa" style="display:none;max-width:160px;max-height:100px;border-radius:8px;margin-top:8px"><div><button class="b" id="gb" style="margin-top:14px" onclick="sendGame()">Enviar juego</button></div></div>`},
'Sugerir música'(){return `<h2>Sugerir música</h2><div class="card" style="max-width:660px"><label class="mu" for="mt">Nombre de la canción</label><input id="mt" maxlength="120" style="width:100%"><p></p><label class="mu" for="ma">Nombre del creador o artista</label><input id="ma" maxlength="120" style="width:100%"><p class="mu">Vikbeing decidirá si puede sonar en directo según las licencias de música de Twitch.</p><button class="b" onclick="sendMusic()">Enviar canción</button></div>`},
Sugerencias(){return `<h2>Sugerencias de la comunidad</h2>${comG()}${comM()}`}};
function ptag(b){const t=b.textContent;if(PK.has(t))PK.delete(t);else if(PK.size<6)PK.add(t);else return toast('Máximo 6 etiquetas');const on=PK.has(t);b.style.background=on?'var(--p)':'';b.style.color=on?'#fff':'';$('cnt').textContent=PK.size+'/6'}
function pimg(){const f=$('img').files[0],p=$('prev');if(f){p.src=URL.createObjectURL(f);p.style.display='block'}else p.style.display='none'}
async function sendGame(){const n=$('gn').value.trim(),f=$('img').files[0];
 if(n.length<2)return toast('Escribe el nombre del juego');if(!PK.size)return toast('Elige al menos una etiqueta');if(!f)return toast('Sube una imagen del juego');
 if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast('Formato no válido: usa PNG, JPG o WEBP');if(f.size>2097152)return toast('La imagen pesa más de 2 MB');
 $('gb').disabled=true;const path=`${user.id}/${Date.now()}.${f.type.split('/')[1].replace('jpeg','jpg')}`;
 let r=await sb.storage.from('game-images').upload(path,f,{contentType:f.type});if(r.error){$('gb').disabled=false;return toast('No se pudo subir la imagen: '+r.error.message)}
 r=await sb.from('game_suggestions').insert({user_name:uname(),name:n,tags:[...PK],image_path:path});
 if(r.error){$('gb').disabled=false;sb.storage.from('game-images').remove([path]);return toast(r.error.code=='23505'?'Ese juego ya fue sugerido.':'No se pudo enviar: '+r.error.message)}
 PK.clear();toast('¡Juego enviado! Vikbeing lo revisará.');await loadCom();go('Sugerencias')}
async function sendMusic(){const t=$('mt').value.trim(),a=$('ma').value.trim();if(!t||!a)return toast('Escribe la canción y el creador');
 const r=await sb.from('music_suggestions').insert({user_name:uname(),title:t,artist:a});if(r.error)return toast(r.error.code=='23505'?'Esa canción ya fue sugerida.':'No se pudo enviar: '+r.error.message);
 toast('¡Canción enviada!');await loadCom();go('Sugerencias')}
init();
</script></body></html>
